version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketpay
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  django-api:
    build: ./docker/Dockerfile-django
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  rust-wallet:
    build: ./docker/Dockerfile-rust
    ports:
      - "3001:3001"

  nextjs-web:
    build: ./docker/Dockerfile-nextjs
    ports:
      - "3000:3000"