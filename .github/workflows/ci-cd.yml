name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: jb-rown
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:

  # BUILD & TEST

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/django-api/requirements.txt

      - name: Install dependencies
        working-directory: backend/django-api
        run: pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend/django-api
        run: python manage.py test

      - name: Run linting
        run: |
          pip install flake8
          flake8 backend/django-api \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web-nextjs
        run: npm ci

      - name: Run ESLint
        working-directory: frontend/web-nextjs
        run: npm run lint

      - name: Build Next.js
        working-directory: frontend/web-nextjs
        run: npm run build

  build-rust:
    name: Build Rust Services
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust-services/wallet-service

      - name: Build Rust service
        working-directory: backend/rust-services/wallet-service
        run: cargo build --release

      - name: Run Rust tests
        working-directory: backend/rust-services/wallet-service
        run: cargo test --release

  # SECURITY SCANNING

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # BUILD AND PUSH DOCKER IMAGES

  build-images:
    name: Build Docker Images
    needs:
      - build-backend
      - build-frontend
      - build-rust
      - security-scan

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DJANGO IMAGE

      - name: Extract metadata for Django
        id: meta-django
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/django-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Django image
        uses: docker/build-push-action@v6
        with:
          context: backend/django-api
          file: backend/django-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-django.outputs.tags }}
          labels: ${{ steps.meta-django.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # WALLET SERVICE IMAGE

      - name: Extract metadata for Wallet Service
        id: meta-wallet
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/wallet-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Wallet Service image
        uses: docker/build-push-action@v6
        with:
          context: backend/rust-services/wallet-service
          file: backend/rust-services/wallet-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-wallet.outputs.tags }}
          labels: ${{ steps.meta-wallet.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # FRONTEND IMAGE

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nextjs-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/web-nextjs
          file: frontend/web-nextjs/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # DEPLOY TO STAGING

  deploy-staging:
    name: Deploy to Staging
    needs: build-images
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl apply \
            -f infrastructure/kubernetes/deployment.yaml \
            --context=staging

      - name: Wait for rollout
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl rollout status \
            deployment/django-api \
            -n marketpay \
            --context=staging

  # DEPLOY TO PRODUCTION

  deploy-production:
    name: Deploy to Production
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl apply \
            -f infrastructure/kubernetes/deployment.yaml \
            --context=production

      - name: Wait for rollout
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl rollout status \
            deployment/django-api \
            -n marketpay \
            --context=production

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false