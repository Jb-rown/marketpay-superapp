name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================
  # BUILD & TEST
  # ========================
  
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend/django-api
          pip install -r requirements.txt

      - name: Run Django tests
        run: |
          cd backend/django-api
          python manage.py test

      - name: Run linting (flake8)
        run: |
          pip install flake8
          flake8 backend/django-api --count --select=E9,F63,F7,F82 --show-source --statistics

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web-nextjs/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend/web-nextjs
          npm ci

      - name: Run ESLint
        run: |
          cd frontend/web-nextjs
          npm run lint

      - name: Build Next.js
        run: |
          cd frontend/web-nextjs
          npm run build

  build-rust:
    name: Build Rust Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust-services/wallet-service

      - name: Build Rust service
        run: |
          cd backend/rust-services/wallet-service
          cargo build --release

      - name: Run Rust tests
        run: |
          cd backend/rust-services/wallet-service
          cargo test --release

  # ========================
  # SECURITY SCANNING
  # ========================

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ========================
  # BUILD DOCKER IMAGES
  # ========================

  build-images:
    name: Build Docker Images
    needs: [build-backend, build-frontend, build-rust, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Django
        id: meta-django
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/marketpay/django-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Django image
        uses: docker/build-push-action@v4
        with:
          context: backend/django-api
          file: backend/django-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-django.outputs.tags }}
          labels: ${{ steps.meta-django.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Wallet Service
        id: meta-wallet
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/marketpay/wallet-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Wallet Service image
        uses: docker/build-push-action@v4
        with:
          context: backend/rust-services/wallet-service
          file: backend/rust-services/wallet-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-wallet.outputs.tags }}
          labels: ${{ steps.meta-wallet.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/marketpay/nextjs-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: frontend/web-nextjs
          file: frontend/web-nextjs/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================
  # DEPLOY TO STAGING
  # ========================

  deploy-staging:
    name: Deploy to Staging
    needs: build-images
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to Kubernetes (Staging)
        run: |
          kubectl apply -f infrastructure/kubernetes/deployment.yaml --context=staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/django-api -n marketpay --context=staging

  # ========================
  # DEPLOY TO PRODUCTION
  # ========================

  deploy-production:
    name: Deploy to Production
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to Kubernetes (Production)
        run: |
          kubectl apply -f infrastructure/kubernetes/deployment.yaml --context=production

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/django-api -n marketpay --context=production

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
